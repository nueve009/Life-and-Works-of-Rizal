<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="ornament-title ornament-desc">
  <title id="ornament-title">Spanish-Filipino Baroque corner ornament</title>
  <desc id="ornament-desc">Symmetrical scrollwork intertwined with sampaguita blossoms and fern tendrils, drawn as fine espresso-brown ink line art.</desc>

  <defs>
    <!-- Five-petal sampaguita blossom. -->
    <g id="ornament-sampaguita" fill="none" stroke="#3E2723" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="0" cy="-7" rx="3.1" ry="5.5"/>
      <ellipse cx="0" cy="-7" rx="3.1" ry="5.5" transform="rotate(72)"/>
      <ellipse cx="0" cy="-7" rx="3.1" ry="5.5" transform="rotate(144)"/>
      <ellipse cx="0" cy="-7" rx="3.1" ry="5.5" transform="rotate(216)"/>
      <ellipse cx="0" cy="-7" rx="3.1" ry="5.5" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="1.9" fill="#3E2723" stroke="none"/>
      <path d="M0 -2.4 V-5 M1.8 -1.4 L3.1 -3.5 M-1.8 -1.4 L-3.1 -3.5" stroke-width=".75"/>
    </g>

    <!-- One fern leaflet. -->
    <path id="ornament-fern-leaf" d="M0 0 C5 -4.4 11 -4 15 .5 C10 3.1 4.5 2.9 0 0 Z" fill="none" stroke="#3E2723" stroke-width="1" stroke-linejoin="round"/>

    <!-- A single corner arm; the second is this arm rotated 90 degrees. -->
    <g id="ornament-arm" fill="none" stroke="#3E2723" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 11 C33 8 50 13 64 25 C78 37 92 45 108 40 C122 36 126 22 116 16 C107 11 100 19 105 26 C109 31 116 29 116 24"/>
      <path d="M22 22 C43 20 56 32 70 46 C84 60 100 64 116 58 C134 51 146 36 164 32 C180 28 194 34 206 27 C214 22 220 14 228 12"/>
      <path d="M158 32 C164 22 176 18 186 23 C194 27 195 36 188 40 C181 44 174 39 177 33"/>
      <path d="M204 27 C212 35 224 36 232 29 C237 25 237 19 233 16"/>
      <path d="M40 10 C52 28 58 48 54 68 C50 86 38 98 22 102"/>
      <path d="M54 68 C62 72 68 80 68 88 C68 94 64 98 59 97 C55 96 54 92 57 90"/>
      <path d="M30 88 C34 96 34 104 28 110 C24 114 18 113 17 108 C16 104 20 101 23 103"/>

      <use href="#ornament-fern-leaf" transform="translate(43 19) rotate(-38)"/>
      <use href="#ornament-fern-leaf" transform="translate(33 24) rotate(202)"/>
      <use href="#ornament-fern-leaf" transform="translate(49 32) rotate(-24)"/>
      <use href="#ornament-fern-leaf" transform="translate(39 39) rotate(192)"/>
      <use href="#ornament-fern-leaf" transform="translate(54 47) rotate(-9)"/>
      <use href="#ornament-fern-leaf" transform="translate(45 54) rotate(178)"/>
      <use href="#ornament-fern-leaf" transform="translate(55 63) rotate(7)"/>
      <use href="#ornament-fern-leaf" transform="translate(47 70) rotate(166)"/>
      <use href="#ornament-fern-leaf" transform="translate(50 78) rotate(22)"/>
      <use href="#ornament-fern-leaf" transform="translate(41 85) rotate(151)"/>
      <use href="#ornament-fern-leaf" transform="translate(39 93) rotate(38)"/>

      <use href="#ornament-sampaguita" transform="translate(92 36) scale(.82)"/>
      <use href="#ornament-sampaguita" transform="translate(146 34) scale(.68)"/>
      <use href="#ornament-sampaguita" transform="translate(197 20) scale(.52)"/>

      <circle cx="72" cy="52" r="1.6" fill="#3E2723" stroke="none"/>
      <circle cx="132" cy="54" r="1.4" fill="#3E2723" stroke="none"/>
      <circle cx="180" cy="46" r="1.2" fill="#3E2723" stroke="none"/>
      <circle cx="24" cy="106" r="1.3" fill="#3E2723" stroke="none"/>
    </g>
  </defs>

  <use href="#ornament-arm"/>
  <use href="#ornament-arm" transform="rotate(90)"/>

  <!-- Small rosette where the two scrolls meet at the corner. -->
  <g fill="none" stroke="#3E2723" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 18 C18 10 30 14 30 23 C30 31 22 36 16 32 C11 29 12 22 18 22"/>
    <path d="M18 10 C10 18 14 30 23 30 C31 30 36 22 32 16 C29 11 22 12 22 18"/>
    <circle cx="19" cy="19" r="2.2" fill="#3E2723" stroke="none"/>
  </g>
</svg>
